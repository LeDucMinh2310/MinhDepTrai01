<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e2e2e7;
    --accent: #0a84ff; --good: #1e8e3e; --danger: #d70015;
    --x: #e5484d; --o: #0a84ff; --paper: #fffdf6; --grid: #d9d3c2; --last: #ffe9a8; --win: #b8f0c8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #a1a1a6; --line: #2c2c2e; --good: #30d158;
            --x: #ff6b6b; --o: #4da3ff; --paper: #1b1a17; --grid: #3a372f; --last: #4a4020; --win: #1f4a2c; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 "Be Vietnam Pro", -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; cursor: pointer; border: 0; }
  button:disabled { opacity: .4; cursor: default; }
  [hidden] { display: none !important; }

  .wrap { max-width: 820px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 10px;
          padding: calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }
  .bar { display: flex; align-items: center; gap: 8px; }
  .bar h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 900; text-align: center; }
  .bar .right { width: 96px; display: flex; justify-content: flex-end; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 8px 13px; border-radius: 999px;
          background: var(--card); border: 1px solid var(--line); color: var(--accent); font-weight: 700; font-size: 14px;
          text-decoration: none; white-space: nowrap; }

  /* ===== Chọn chế độ ===== */
  .setup { display: flex; flex-direction: column; gap: 14px; }
  .hero { border-radius: 24px; padding: 22px 18px; text-align: center; color: #fff;
          background: linear-gradient(135deg, #ff6b6b, #8e44ef 55%, #0a84ff); box-shadow: 0 10px 26px rgba(142, 68, 239, .3); }
  .hero .xo { font-size: 44px; font-weight: 900; letter-spacing: 6px; }
  .hero h2 { margin: 2px 0; font-size: 26px; font-weight: 900; }
  .hero p { margin: 0; opacity: .9; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
  .panel h3 { margin: 0 0 10px; font-size: 17px; }
  .panel h3:not(:first-child) { margin-top: 18px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .seg.wrap5 { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
  .seg button { padding: 12px 4px; border-radius: 14px; background: var(--bg); color: var(--text); font-weight: 700; font-size: 16px;
                border: 2px solid var(--line); }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg small { display: block; font-weight: 500; font-size: 12px; opacity: .8; }
  .note { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .sw { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; cursor: pointer; }
  .sw input { appearance: none; -webkit-appearance: none; flex: none; width: 50px; height: 30px; border-radius: 999px;
              background: var(--line); position: relative; transition: background .2s; margin: 2px 0 0; cursor: pointer; }
  .sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
                     background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
  .sw input:checked { background: var(--good); }
  .sw input:checked::after { transform: translateX(20px); }
  .sw b { display: block; }
  .sw small { color: var(--muted); font-size: 14px; }
  .primary { padding: 15px; border-radius: 16px; background: var(--accent); color: #fff; font-weight: 800; font-size: 18px; }

  /* ===== Bàn cờ ===== */
  .game { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .tools { display: flex; gap: 6px; align-items: center; }
  .tools .sp { flex: 1; }
  .status { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px;
            border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
  .turn { font-weight: 800; font-size: 16px; }
  .score { font-weight: 800; font-size: 15px; white-space: nowrap; }
  .mk { font-weight: 900; }
  .mk.X { color: var(--x); } .mk.O { color: var(--o); }
  .status.win { background: var(--win); }
  body.playing .wrap { height: 100vh; height: 100dvh; }
  .boardbox { position: relative; flex: 1; min-height: 260px; }
  .boardwrap { position: absolute; inset: 0; overflow: auto; border-radius: 18px; background: var(--paper);
               border: 1px solid var(--line); overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .board { --cs: 32px; display: grid; gap: 1px; background: var(--grid); padding: 1px; width: max-content; margin: auto;
           grid-auto-rows: var(--cs); }
  .boardwrap.fit { display: flex; align-items: center; justify-content: center; }
  .c { width: var(--cs); height: var(--cs); background: var(--paper); display: grid; place-items: center; touch-action: manipulation;
       font-weight: 900; font-size: calc(var(--cs) * .66); line-height: 1; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .c.X { color: var(--x); } .c.O { color: var(--o); }
  .c.X, .c.O { cursor: default; }
  .c.last { background: var(--last); }
  .c.w { background: var(--win); animation: pop .5s ease-out; }
  .c.new { animation: put .2s ease-out; }
  @keyframes put { from { transform: scale(1.6); } }
  @keyframes pop { 50% { transform: scale(1.25); } }
  .zoom { position: absolute; top: 8px; right: 8px; z-index: 5; display: flex; flex-direction: column; gap: 6px; }
  .zoom button { width: 40px; height: 40px; border-radius: 12px; background: var(--card); color: var(--text); font-size: 20px; font-weight: 800;
                 border: 1px solid var(--line) !important; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions button { padding: 13px; border-radius: 14px; font-weight: 800; }
  .ghost { background: var(--card); color: var(--text); border: 2px solid var(--line) !important; }
</style>

<body>
<div class="wrap">
  <header class="bar">
    <a class="pill" href="../../">← Trang chủ</a>
    <h1>⭕ Cờ caro</h1>
    <span class="right"><button class="pill" id="soundBtn" aria-label="Bật/tắt âm thanh">🔊</button></span>
  </header>

  <!-- Chọn chế độ -->
  <section class="setup" id="setup">
    <div class="hero">
      <div class="xo"><span style="color:#ffd1d1">✕</span><span style="color:#d6ecff">◯</span></div>
      <h2>Cờ caro</h2>
      <p>Xếp đủ 5 con thẳng hàng là thắng!</p>
    </div>
    <div class="panel">
      <h3>Chơi với ai</h3>
      <div class="seg" id="segMode">
        <button data-v="ai">🤖 Với máy<small>Một mình</small></button>
        <button data-v="pvp">👥 2 người<small>Chung một máy</small></button>
      </div>
      <div id="aiBox">
        <h3>Độ khó</h3>
        <div class="seg" id="segLevel">
          <button data-v="easy">Dễ</button><button data-v="mid">Vừa</button><button data-v="hard">Khó</button>
        </div>
        <h3>Bạn cầm quân</h3>
        <div class="seg" id="segSide">
          <button data-v="X"><span class="mk X">✕</span> X<small>Đi trước</small></button>
          <button data-v="O"><span class="mk O">◯</span> O<small>Máy đi trước</small></button>
        </div>
      </div>
      <h3>Kích thước bàn</h3>
      <div class="seg wrap5" id="segSize">
        <button data-v="0">♾ Tự mở rộng<small>Bàn tự nới ra</small></button>
        <button data-v="15">15 × 15</button>
        <button data-v="20">20 × 20</button>
        <button data-v="10">10 × 10</button>
        <button data-v="3">3 × 3<small>3 con thắng</small></button>
      </div>
      <p class="note" id="sizeNote"></p>
      <label class="sw" id="blockBox"><input type="checkbox" id="optBlock">
        <span><b>Chặn 2 đầu</b><small>5 con mà bị đối thủ chặn cả 2 đầu thì không tính thắng (luật caro Việt Nam).</small></span></label>
    </div>
    <button class="primary" id="startBtn">Bắt đầu chơi</button>
  </section>

  <!-- Bàn cờ -->
  <section class="game" id="game" hidden>
    <div class="tools">
      <button class="pill" id="setupBtn">⚙️ Chế độ</button>
      <span class="sp"></span>
      <button class="pill" id="undoBtn">↶ Đi lại</button>
      <button class="pill" id="newBtn">⟲ Ván mới</button>
    </div>
    <div class="status" id="status"><span class="turn" id="turnText"></span><span class="score" id="scoreText"></span></div>
    <div class="boardbox">
      <div class="zoom">
        <button id="zoomIn" aria-label="Phóng to">+</button>
        <button id="zoomOut" aria-label="Thu nhỏ">−</button>
        <button id="focusBtn" aria-label="Về nước vừa đánh">◎</button>
      </div>
      <div class="boardwrap" id="boardWrap"><div class="board" id="board"></div></div>
    </div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ================= Âm thanh =================
const Sfx = {
  ctx: null, on: store.get('caro-sound', true),
  init() {
    if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, dur, { type = 'sine', vol = .15, at = 0, slide = null } = {}) {
    const c = this.ctx;
    if (!c || !this.on) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
  },
  put(p) { this.tone(p === 'X' ? 520 : 390, .09, { type: 'triangle', vol: .18, slide: p === 'X' ? 700 : 300 }); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .25, { type: 'triangle', at: i * .12 })); this.tone(1047, .6, { type: 'triangle', vol: .12, at: .5 }); },
  lose() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, .3, { type: 'triangle', vol: .13, at: i * .18 })); },
  draw() { this.tone(440, .2, { type: 'triangle' }); this.tone(440, .3, { type: 'triangle', at: .25 }); },
  undo() { this.tone(500, .08, { vol: .1, slide: 300 }); }
};
['pointerdown', 'touchend', 'click'].forEach(t => addEventListener(t, () => Sfx.init(), { passive: true }));
function renderSound() { $('#soundBtn').textContent = Sfx.on ? '🔊' : '🔇'; }
$('#soundBtn').addEventListener('click', () => { Sfx.on = !Sfx.on; store.set('caro-sound', Sfx.on); renderSound(); });
renderSound();

// ================= Cài đặt =================
const S = Object.assign({ mode: 'ai', level: 'mid', side: 'X', size: 0, block: false }, store.get('caro-setup', {}));
function renderSetup() {
  const mark = (id, v) => document.querySelectorAll(`#${id} button`).forEach(b => b.classList.toggle('on', b.dataset.v === String(v)));
  mark('segMode', S.mode); mark('segLevel', S.level); mark('segSide', S.side); mark('segSize', S.size);
  $('#aiBox').hidden = S.mode !== 'ai';
  $('#blockBox').hidden = S.size === 3;
  $('#optBlock').checked = S.block;
  $('#sizeNote').textContent = S.size === 0 ? 'Bàn bắt đầu 15 × 15, đánh gần tới mép thì tự nới rộng thêm, không bao giờ hết chỗ.'
    : S.size === 3 ? 'Bàn nhỏ kiểu tic-tac-toe: xếp đủ 3 con là thắng.' : `Bàn cố định ${S.size} × ${S.size}, xếp đủ 5 con là thắng.`;
}
const bindSeg = (id, key, num) => $(`#${id}`).addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S[key] = num ? +b.dataset.v : b.dataset.v;
  store.set('caro-setup', S); renderSetup();
});
bindSeg('segMode', 'mode'); bindSeg('segLevel', 'level'); bindSeg('segSide', 'side'); bindSeg('segSize', 'size', true);
$('#optBlock').addEventListener('change', e => { S.block = e.target.checked; store.set('caro-setup', S); });
renderSetup();

// ================= Luật & bàn cờ =================
const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];
const other = p => p === 'X' ? 'O' : 'X';
const key = (x, y) => x + ',' + y;
const G = { stones: new Map(), moves: [], turn: 'X', over: false, win: null, b: null, size: 0, need: 5, block: false, token: 0 };

const get = (x, y) => G.stones.get(key(x, y));
const inBounds = (x, y) => !G.size || (x >= 0 && y >= 0 && x < G.size && y < G.size);

// Trả về các ô thắng nếu nước (x, y) của p tạo thành hàng đủ quân
function winLine(x, y, p) {
  for (const [dx, dy] of DIRS) {
    const cells = [[x, y]];
    let f = 1, b = 1;
    while (get(x + f * dx, y + f * dy) === p) { cells.push([x + f * dx, y + f * dy]); f++; }
    while (get(x - b * dx, y - b * dy) === p) { cells.push([x - b * dx, y - b * dy]); b++; }
    if (cells.length < G.need) continue;
    if (G.block && G.need === 5) {
      const o = other(p);
      if (get(x + f * dx, y + f * dy) === o && get(x - b * dx, y - b * dy) === o) continue; // bị chặn 2 đầu
    }
    return cells;
  }
  return null;
}

// ================= Máy chơi =================
// Chấm điểm một ô trống: xét mọi "cửa sổ" dài bằng số quân cần để thắng đi qua ô đó,
// cửa sổ nào không có quân đối thủ thì cộng điểm theo số quân của mình trong đó.
const WEIGHTS = { 5: [0, 1, 12, 150, 3000, 1e7], 3: [0, 1, 40, 1e7] };
function evalCell(x, y, p) {
  const L = G.need, W = WEIGHTS[L];
  let total = 0;
  for (const [dx, dy] of DIRS) {
    for (let k = -(L - 1); k <= 0; k++) {
      let cnt = 1, ok = true;
      for (let i = 0; i < L; i++) {
        const cx = x + (k + i) * dx, cy = y + (k + i) * dy;
        if (cx === x && cy === y) continue;
        if (!inBounds(cx, cy)) { ok = false; break; }
        const v = get(cx, cy);
        if (v === p) cnt++;
        else if (v) { ok = false; break; }
      }
      if (ok) total += W[cnt];
    }
  }
  return total;
}

function candidates() {
  if (!G.stones.size) {
    const c = G.size ? Math.floor(G.size / 2) : 0;
    return [[c, c]];
  }
  const seen = new Set(), out = [];
  const R = G.need === 3 ? 3 : 2;
  G.stones.forEach((v, k) => {
    const [sx, sy] = k.split(',').map(Number);
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
      const x = sx + dx, y = sy + dy, kk = key(x, y);
      if (seen.has(kk) || get(x, y) || !inBounds(x, y)) continue;
      seen.add(kk); out.push([x, y]);
    }
  });
  return out;
}

function wouldWin(x, y, p) {
  G.stones.set(key(x, y), p);
  const w = winLine(x, y, p);
  G.stones.delete(key(x, y));
  return !!w;
}

// Bàn 3×3: tính trước hết các nước (minimax) nên chơi hoàn hảo
function minimax(p, me, depth) {
  let best = null, bestScore = p === me ? -Infinity : Infinity;
  for (const [x, y] of candidates()) {
    G.stones.set(key(x, y), p);
    let s;
    if (winLine(x, y, p)) s = (p === me ? 10 : -10) - depth * (p === me ? 1 : -1);
    else if (G.stones.size === 9) s = 0;
    else s = minimax(other(p), me, depth + 1).score;
    G.stones.delete(key(x, y));
    if (p === me ? s > bestScore : s < bestScore) { bestScore = s; best = [x, y]; }
  }
  return { score: bestScore, move: best };
}

function aiMove() {
  const me = G.turn, op = other(me), cands = candidates();
  const lv = S.level;
  if (G.need === 3) {
    if (lv === 'easy' && Math.random() < .5) return cands[Math.floor(Math.random() * cands.length)];
    if (lv === 'mid' && Math.random() < .2) return cands[Math.floor(Math.random() * cands.length)];
    return minimax(me, me, 0).move;
  }
  const win = cands.find(([x, y]) => wouldWin(x, y, me));
  if (win) return win;
  const block = cands.find(([x, y]) => wouldWin(x, y, op));
  if (block && !(lv === 'easy' && Math.random() < .35)) return block;

  const def = { easy: .55, mid: .9, hard: 1 }[lv];
  const scored = cands.map(([x, y]) => ({ c: [x, y], s: evalCell(x, y, me) + evalCell(x, y, op) * def }))
                      .sort((a, b) => b.s - a.s);
  if (lv === 'easy') return scored[Math.floor(Math.random() * Math.min(6, scored.length))].c;
  if (lv === 'mid') {
    const near = scored.filter(m => m.s >= scored[0].s * .85).slice(0, 3);
    return near[Math.floor(Math.random() * near.length)].c;
  }
  return scored[0].c;
}

// ================= Diễn biến ván =================
const isAiTurn = () => S.mode === 'ai' && !G.over && G.turn !== S.side;

function newGame() {
  G.token++;
  G.size = S.size; G.need = S.size === 3 ? 3 : 5; G.block = S.block && S.size !== 3;
  G.stones = new Map(); G.moves = []; G.turn = 'X'; G.over = false; G.win = null; G.scored = null;
  G.b = G.size ? { minX: 0, maxX: G.size - 1, minY: 0, maxY: G.size - 1 } : { minX: -7, maxX: 7, minY: -7, maxY: 7 };
  zoom = 1;
  render({ center: true });
  scheduleAi();
}

function place(x, y) {
  if (G.over || get(x, y) || !inBounds(x, y)) return;
  const p = G.turn;
  G.stones.set(key(x, y), p);
  G.moves.push([x, y, p]);
  Sfx.put(p);
  const grow = expand(x, y);
  const line = winLine(x, y, p);
  if (line) { G.over = true; G.win = { p, cells: line }; }
  else if (G.size && G.stones.size === G.size * G.size) { G.over = true; G.win = { p: null, cells: [] }; }
  else G.turn = other(p);
  render({ grow, focus: [x, y] });
  if (G.over) finish();
  else scheduleAi();
}

// Bàn tự mở rộng: còn ít hơn 3 ô tới mép thì nới thêm về phía đó
function expand(x, y) {
  if (G.size) return { left: 0, top: 0 };
  const b = G.b, M = 3, ADD = 4, grow = { left: 0, top: 0 };
  if (x - b.minX < M) { grow.left = ADD; b.minX -= ADD; }
  if (b.maxX - x < M) b.maxX += ADD;
  if (y - b.minY < M) { grow.top = ADD; b.minY -= ADD; }
  if (b.maxY - y < M) b.maxY += ADD;
  return grow;
}

function scheduleAi() {
  if (!isAiTurn()) return;
  const t = G.token;
  setTimeout(() => {
    if (t !== G.token || !isAiTurn()) return;
    const [x, y] = aiMove();
    place(x, y);
  }, G.stones.size ? 380 : 250);
}

function undo() {
  if (!G.moves.length) return;
  G.token++;
  if (G.over && G.scored) { // đi lại sau khi đã phân thắng thua thì trả lại điểm ván đó
    const sc = store.get(scoreKey(), { X: 0, O: 0, draw: 0 });
    sc[G.scored] = Math.max(0, sc[G.scored] - 1);
    store.set(scoreKey(), sc);
  }
  G.scored = null;
  // Đấu với máy: lùi đến khi tới lượt mình (thường là 2 nước)
  do {
    const [x, y] = G.moves.pop();
    G.stones.delete(key(x, y));
  } while (S.mode === 'ai' && G.moves.length && G.moves[G.moves.length - 1][2] === S.side);
  G.turn = G.moves.length ? other(G.moves[G.moves.length - 1][2]) : 'X';
  G.over = false; G.win = null;
  Sfx.undo();
  const last = G.moves[G.moves.length - 1];
  render({ focus: last ? [last[0], last[1]] : null });
  scheduleAi();
}

// ================= Điểm =================
const scoreKey = () => `caro-score-${S.mode}`;
function finish() {
  const sc = store.get(scoreKey(), { X: 0, O: 0, draw: 0 });
  const w = G.win.p;
  G.scored = w || 'draw';
  sc[G.scored]++;
  store.set(scoreKey(), sc);
  renderStatus();
  if (!w) Sfx.draw();
  else if (S.mode === 'ai' && w !== S.side) Sfx.lose();
  else Sfx.win();
}

// ================= Vẽ =================
const wrapEl = $('#boardWrap'), boardEl = $('#board');
let zoom = 1, cs = 32;
const who = p => S.mode === 'ai' ? (p === S.side ? 'Bạn' : 'Máy') : `Người ${p}`;
const mk = p => `<span class="mk ${p}">${p === 'X' ? '✕' : '◯'}</span>`;

function renderStatus() {
  const st = $('#status');
  st.classList.toggle('win', G.over);
  let t;
  if (G.over) {
    const w = G.win.p;
    t = !w ? '🤝 Hoà rồi!' : S.mode === 'ai' ? (w === S.side ? `🎉 Bạn thắng! ${mk(w)}` : `😢 Máy thắng ${mk(w)}`) : `🎉 ${mk(w)} thắng!`;
  } else {
    t = `Lượt: ${mk(G.turn)} ${who(G.turn)}${isAiTurn() ? ' đang nghĩ…' : ''}`;
  }
  $('#turnText').innerHTML = t;
  const sc = store.get(scoreKey(), { X: 0, O: 0, draw: 0 });
  $('#scoreText').innerHTML = S.mode === 'ai'
    ? `Bạn ${sc[S.side]} – ${sc[other(S.side)]} Máy`
    : `${mk('X')} ${sc.X} – ${sc.O} ${mk('O')}`;
  $('#undoBtn').disabled = !G.moves.length || (S.mode === 'ai' && !G.moves.some(m => m[2] === S.side));
}

function cellSize() {
  const cols = G.b.maxX - G.b.minX + 1;
  let base;
  if (G.size) base = Math.min(G.size === 3 ? 92 : 46, Math.floor((wrapEl.clientWidth - 4 - cols) / cols));
  else base = 34;
  return Math.max(14, Math.min(72, Math.round(base * zoom)));
}

function render({ grow = { left: 0, top: 0 }, focus = null, center = false } = {}) {
  const prevLeft = wrapEl.scrollLeft, prevTop = wrapEl.scrollTop;
  cs = cellSize();
  // Bàn tự mở rộng: luôn kẻ ô phủ kín khung nhìn
  if (!G.size) {
    const pitch = cs + 1, b = G.b;
    const needC = Math.ceil(wrapEl.clientWidth / pitch) + 2, needR = Math.ceil(wrapEl.clientHeight / pitch) + 2;
    while (b.maxX - b.minX + 1 < needC) { b.maxX++; if (b.maxX - b.minX + 1 < needC) { b.minX--; grow.left++; } }
    while (b.maxY - b.minY + 1 < needR) { b.maxY++; if (b.maxY - b.minY + 1 < needR) { b.minY--; grow.top++; } }
  }
  const { minX, maxX, minY, maxY } = G.b;
  const cols = maxX - minX + 1;
  boardEl.style.setProperty('--cs', cs + 'px');
  boardEl.style.gridTemplateColumns = `repeat(${cols}, var(--cs))`;
  const last = G.moves[G.moves.length - 1];
  const winSet = new Set((G.win?.cells || []).map(([x, y]) => key(x, y)));
  let html = '';
  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      const v = get(x, y), k = key(x, y);
      let cls = 'c';
      if (v) cls += ' ' + v;
      if (last && last[0] === x && last[1] === y) cls += ' last' + (focus ? ' new' : '');
      if (winSet.has(k)) cls += ' w';
      html += `<div class="${cls}" data-x="${x}" data-y="${y}">${v ? (v === 'X' ? '✕' : '◯') : ''}</div>`;
    }
  }
  boardEl.innerHTML = html;
  const fits = boardEl.offsetWidth <= wrapEl.clientWidth && boardEl.offsetHeight <= wrapEl.clientHeight;
  wrapEl.classList.toggle('fit', fits);
  // Bàn nới sang trái / lên trên thì giữ nguyên chỗ đang nhìn
  wrapEl.scrollLeft = prevLeft + grow.left * (cs + 1);
  wrapEl.scrollTop = prevTop + grow.top * (cs + 1);
  if (center) centerOn(G.size ? Math.floor(G.size / 2) : 0, G.size ? Math.floor(G.size / 2) : 0);
  else if (focus) ensureVisible(focus[0], focus[1]);
  renderStatus();
}

function cellEl(x, y) { return boardEl.querySelector(`[data-x="${x}"][data-y="${y}"]`); }
function centerOn(x, y) {
  const el = cellEl(x, y);
  if (!el) return;
  wrapEl.scrollLeft = el.offsetLeft - wrapEl.clientWidth / 2 + cs / 2;
  wrapEl.scrollTop = el.offsetTop - wrapEl.clientHeight / 2 + cs / 2;
}
function ensureVisible(x, y) {
  const el = cellEl(x, y);
  if (!el) return;
  const pad = cs * 2;
  const l = el.offsetLeft, t = el.offsetTop;
  if (l - pad < wrapEl.scrollLeft) wrapEl.scrollLeft = l - pad;
  else if (l + cs + pad > wrapEl.scrollLeft + wrapEl.clientWidth) wrapEl.scrollLeft = l + cs + pad - wrapEl.clientWidth;
  if (t - pad < wrapEl.scrollTop) wrapEl.scrollTop = t - pad;
  else if (t + cs + pad > wrapEl.scrollTop + wrapEl.clientHeight) wrapEl.scrollTop = t + cs + pad - wrapEl.clientHeight;
}

boardEl.addEventListener('click', e => {
  const el = e.target.closest('.c');
  if (!el || G.over || isAiTurn()) return;
  place(+el.dataset.x, +el.dataset.y);
});

function setZoom(z) {
  const last = G.moves[G.moves.length - 1];
  zoom = Math.max(.5, Math.min(2.2, z));
  render();
  if (last) centerOn(last[0], last[1]);
}
$('#zoomIn').addEventListener('click', () => setZoom(zoom * 1.2));
$('#zoomOut').addEventListener('click', () => setZoom(zoom / 1.2));
$('#focusBtn').addEventListener('click', () => {
  const last = G.moves[G.moves.length - 1];
  last ? centerOn(last[0], last[1]) : centerOn(G.size ? Math.floor(G.size / 2) : 0, G.size ? Math.floor(G.size / 2) : 0);
});
addEventListener('resize', () => { if (!$('#game').hidden) render(); });

// ================= Nút bấm =================
$('#startBtn').addEventListener('click', () => {
  store.set('caro-setup', S);
  $('#setup').hidden = true; $('#game').hidden = false;
  document.body.classList.add('playing');
  newGame();
});
$('#newBtn').addEventListener('click', () => {
  if (!G.over && G.moves.length > 2 && !confirm('Bỏ ván đang chơi và bắt đầu ván mới?')) return;
  newGame();
});
$('#undoBtn').addEventListener('click', undo);
$('#setupBtn').addEventListener('click', () => {
  if (!G.over && G.moves.length > 2 && !confirm('Bỏ ván đang chơi để đổi chế độ?')) return;
  G.token++;
  $('#game').hidden = true; $('#setup').hidden = false;
  document.body.classList.remove('playing');
  renderSetup();
});
</script>
</body>
